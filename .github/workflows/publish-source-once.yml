name: Import verified QingView 0.1.2 source once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    if: github.repository == 'RGB-hengzhi/QingView' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Import the exact source archive attached to the release
        shell: bash
        run: |
          set -euo pipefail
          release_asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == "v0.1.2") | .assets[] | select(.name == "QingView-0.1.2-source.zip") | .id')
          test -n "$release_asset_id"
          source_archive="$RUNNER_TEMP/qingview-0.1.2-source.zip"
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$release_asset_id" > "$source_archive"
          printf '%s  %s\n' '12552a0603a48a0678d80d7fc260f80ab3fd569d8ccf77b7ac260750b0d28167' "$source_archive" | sha256sum --check --strict
          python3 - "$source_archive" "$RUNNER_TEMP/qingview-source-import" <<'PYCODE'
          import pathlib, sys, zipfile
          target = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(sys.argv[1]) as archive:
              archive.extractall(target)
              for entry in archive.infolist():
                  if not entry.is_dir():
                      (target / entry.filename).chmod((entry.external_attr >> 16 & 0o777) or 0o644)
          PYCODE
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch origin main
          git checkout -b main FETCH_HEAD
          cp -R "$RUNNER_TEMP/qingview-source-import/QingView/." .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish verified QingView 0.1.2 source and illustrated documentation'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:main
